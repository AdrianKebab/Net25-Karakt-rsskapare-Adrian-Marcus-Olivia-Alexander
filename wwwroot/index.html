<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Character Creator</title>

    <link rel="stylesheet" href="styles.css">
    <script defer src="index.js"></script>
</head>

<body>

    <main class="container">

        <section class="creator">

            <h1>Character Creator</h1>

            <p>Beskriv karaktären du vill skapa...</p>

            <textarea
                id="character-prompt"
                placeholder="Exempel: Jag vill ha en äventyrlig och lösningsorienterad ninja med 18 svärd"
            ></textarea>

            <button id="create-character">
                Skapa karaktär
            </button>

        </section>


        <section class="character-card">

            <div class="character-image">

                <img
    id="character-image"
    src="images/kalle.jpg"
    alt="Karaktärsporträtt"
>

            </div>


            <div class="character-header">

                <h2 id="character-name">
                    Din karaktär
                </h2>

                <p id="character-job">
                    Klass / Yrke
                </p>

            </div>


            <div class="character-section">

                <h3>Färdigheter</h3>

                <ul id="character-skills">
                    <li>Färdigheter visas här</li>
                </ul>

            </div>


            <div class="character-section">

                <h3>Utrustning</h3>

                <ul id="character-equipment">
                    <li>Utrustning visas här</li>
                </ul>

            </div>


            <div class="character-section">

                <h3>Bakgrund</h3>

                <p id="character-story">
                    Bakgrundshistorien för din karaktär kommer att visas här.
                </p>

            </div>


            <button id="print-character">
                Skriv ut
            </button>

        </section>

    </main>

</body>

</html>
